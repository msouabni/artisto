domains:
  - id: taxonomy
    label: "Taxonomie universelle et dérivées"
    use_cases:
      - id: TAXO_CREATE_UNIVERSAL
        title: "Créer et maintenir la taxonomie universelle v0 FR/EN/AR"
        phase: 1
        actors: ["admin_plateforme"]
        status: done
        description: "Définir et maintenir la hiérarchie des thèmes universels pour la base d’images."
        related_files:
          - "docker-compose.yml"
          - "data/taxonomy_editor.html"
          - "data/schema.sql"
          - "src/taxonomy.py"
          - "src/api/"
          - "docs/taxonomy_universal_v0.md"
        related_taxonomy_terms:
          - "animaux"
          - "mandalas"
          - "vehicules"
      - id: TAXO_DERIVE_SITE_TAXONOMY
        title: "Dériver une taxonomie simplifiée pour un site"
        phase: 5
        actors: ["admin_plateforme"]
        status: planned
        description: "Créer et maintenir une taxonomie de sortie adaptée à un site (langue/pays/audience) à partir de la taxonomie universelle."
        related_files:
          - "data/taxonomy_universal_v0.json"
          - "architecture.md"
      - id: TAXO_ADD_TERM
        title: "Ajouter un terme à la taxonomie"
        phase: 1
        actors: ["admin_plateforme"]
        status: done
        description: "Ajouter un nouveau terme (racine ou enfant) avec id, slug, libellés FR/EN/AR et weight."
        related_files:
          - "data/taxonomy_universal_v0.json"
          - "data/taxonomy_editor.html"
          - "src/taxonomy.py"
      - id: TAXO_MOVE_TERM
        title: "Déplacer un terme (changer de parent)"
        phase: 1
        actors: ["admin_plateforme"]
        status: done
        description: "Changer le parent d'un terme existant ou le promouvoir en racine."
        related_files:
          - "data/taxonomy_universal_v0.json"
          - "data/taxonomy_editor.html"
          - "src/api/routes/taxonomy.py"
      - id: TAXO_REORDER_TERMS
        title: "Réordonner les termes (weight)"
        phase: 1
        actors: ["admin_plateforme"]
        status: done
        description: "Modifier l'ordre d'affichage des termes parmi leurs frères via le champ weight."
        related_files:
          - "data/taxonomy_universal_v0.json"
          - "data/taxonomy_editor.html"
          - "src/taxonomy.py"
      - id: TAXO_RENAME_TERM
        title: "Renommer un terme ou modifier ses libellés"
        phase: 1
        actors: ["admin_plateforme"]
        status: done
        description: "Modifier les libellés multilingues (name_fr, name_en, name_ar) d'un terme. L'id reste stable."
        related_files:
          - "data/taxonomy_universal_v0.json"
          - "data/taxonomy_editor.html"
          - "src/taxonomy.py"
      - id: TAXO_UPDATE_SLUG
        title: "Modifier le slug d'un terme"
        phase: 1
        actors: ["admin_plateforme"]
        status: done
        description: "Changer le slug d'un terme pour les URLs. Impact sur les exports et les sites dérivés."
        related_files:
          - "data/taxonomy_universal_v0.json"
          - "data/taxonomy_editor.html"
          - "src/taxonomy.py"
      - id: TAXO_DELETE_TERM
        title: "Supprimer ou déprécier un terme"
        phase: 1
        actors: ["admin_plateforme"]
        status: done
        description: "Supprimer un terme de la taxonomie ou le marquer comme déprécié. Vérifier les images et taxonomies de sortie impactées."
        related_files:
          - "data/taxonomy_universal_v0.json"
          - "data/taxonomy_editor.html"
          - "src/taxonomy.py"
          - "architecture.md"
      - id: TAXO_UPDATE_TRANSLATIONS
        title: "Gérer les traductions d'un terme (FR/EN/AR)"
        phase: 1
        actors: ["admin_plateforme"]
        status: done
        description: "Ajouter ou modifier les champs name_* et description_* pour une ou plusieurs langues."
        related_files:
          - "data/taxonomy_universal_v0.json"
          - "data/taxonomy_editor.html"
          - "src/taxonomy.py"
      - id: TAXO_AUDIT_TERM_REFERENCES
        title: "Auditer les références avant modification/suppression"
        phase: 1
        actors: ["admin_plateforme"]
        status: planned
        description: "Lister les images, taxonomies de sortie et use cases référençant un terme avant de le modifier ou supprimer."
        related_files:
          - "src/taxonomy.py"
          - "architecture.md"
          - "docs/use-cases/use_cases.yaml"

  - id: generation
    label: "Génération de concepts, prompts et images"
    use_cases:
      - id: GEN_CONCEPTS_FROM_THEME
        title: "Générer des concepts à partir d’un thème"
        phase: 2
        actors: ["admin_plateforme", "agent_systeme"]
        status: done
        description: "À partir d’un thème saisi et de la taxonomie, produire une liste de concepts alignés."
        related_files:
          - "src/api/routes/ai.py"
          - "prompts/image_prompts.yaml"
      - id: GEN_PROMPTS_FROM_CONCEPTS
        title: "Générer des prompts line art à partir de concepts"
        phase: 2
        actors: ["admin_plateforme", "agent_systeme"]
        status: done
        description: "Transformer les concepts en prompts optimisés pour la génération de line art sans ombrage."
        related_files:
          - "src/api/routes/ai.py"
          - "prompts/image_prompts.yaml"
          - "data/images_editor.html"
      - id: GEN_IMAGES_FROM_PROMPTS
        title: "Générer des images à partir de prompts"
        phase: 3
        actors: ["agent_systeme"]
        status: done
        description: "Générer des images via ComfyUI (z_image_turbo_bf16) ; paramètres de sampling configurables (job.config, presets API)."
        related_files:
          - "src/image_generation.py"
          - "src/workers/image_worker.py"
          - "src/workers/comfy_client.py"
          - "src/api/routes/generation.py"
          - "src/api/routes/images.py"
          - "data/workflows/z_image_turbo_v1.json"
          - "data/images_editor.html"
          - "docs/tuning-guide.md"
          - "scripts/run_image_worker.py"
          - "data/schema.sql"
          - "architecture.md"
  - id: postprocess
    label: "Post-traitement des images"
    use_cases:
      - id: POST_CLEAN_LINEART
        title: "Nettoyer les images pour obtenir un line art imprimable"
        phase: 4
        actors: ["agent_systeme"]
        status: planned
        description: "Appliquer binarisation, débruitage et renforcement de contours pour obtenir un line art propre."
        related_files:
          - "src/postprocess.py"
      - id: POST_UPSCALE_FOR_PRINT
        title: "Préparer les images pour l’impression"
        phase: 4
        actors: ["agent_systeme"]
        status: planned
        description: "Mettre à l’échelle et ajuster la résolution des images pour impression (300 DPI)."
        related_files:
          - "src/postprocess.py"

  - id: export
    label: "Export des collections"
    use_cases:
      - id: EXP_EXPORT_COLLECTION_FOLDER
        title: "Exporter une collection dans un dossier"
        phase: 4
        actors: ["admin_plateforme", "agent_systeme"]
        status: planned
        description: "Regrouper les images d’un thème dans un dossier de collection prêt à être utilisé."
        related_files:
          - "src/pipeline.py"
      - id: EXP_EXPORT_COLLECTION_PDF
        title: "Exporter une collection en PDF"
        phase: 4
        actors: ["admin_plateforme"]
        status: planned
        description: "Générer un PDF regroupant les images d’une collection pour impression."
        related_files:
          - "src/pipeline.py"

  - id: monitoring
    label: "Monitoring et pilotage"
    use_cases:
      - id: MON_TRACK_JOBS
        title: "Suivre les jobs de génération et post-traitement"
        phase: 4
        actors: ["admin_plateforme"]
        status: done
        description: "Suivre l’état des jobs (en cours, réussi, en erreur) via les tables SQLite."
        related_files:
          - "architecture.md"
          - "data/schema.sql"
          - "data/jobs_editor.html"
          - "data/images_editor.html"
          - "src/api/routes/jobs.py"
          - "src/api/routes/images.py"
          - "src/workers/base_worker.py"
          - "scripts/run_migration_v7.py"
      - id: JOB_TEXT_VALIDATION
        title: "Valider les résultats des jobs texte (diff JSON)"
        phase: 4
        actors: ["admin_plateforme"]
        status: done
        description: "Pour les jobs text_enrichment (Ollama), visualiser le diff field-level entre entité actuelle et proposition, puis appliquer ou rejeter partiellement."
        related_files:
          - "src/api/routes/jobs.py"
          - "src/workers/text_worker.py"
          - "scripts/run_text_worker.py"
          - "data/jobs_editor.html"
      - id: MON_TAXONOMY_COVERAGE
        title: "Mesurer la couverture de la taxonomie"
        phase: 4
        actors: ["admin_plateforme"]
        status: planned
        description: "Mesurer combien d’images existent par branche de la taxonomie pour identifier les manques."
        related_files:
          - "architecture.md"
      - id: BENCHMARK_ANNOTATOR_V2
        title: "Annoter les benchmarks POC via la grille structurée v2"
        phase: 4
        actors: ["admin_plateforme"]
        status: done
        description: "Refonte de l'annotateur benchmark : header sticky, score 1-6, raccourcis chord (D pour image_tags, T pour prompt_tags), grille structurée 3 axes (Image 18 / Prompt 8 / Custom libre) + flags pattern/sample/publishable. Migration auto v1 → v2 (mappings defects→image_tags, notes pills→tags, score 1-10 → 1-6 avec score_legacy conservé). Storage benchmark reste fichier annotations.json sous docs/reports/<dir>/. Schéma annotation figé (sera réutilisé tel quel par le greffon prod, cf. brief 2026-05-09_brief-greffon-prod.md)."
        related_files:
          - "data/benchmark-annotator.html"
          - "src/api/routes/benchmark.py"
          - "scripts/migrate_benchmark_annotations.py"
          - "tests/test_benchmark_routes.py"
          - "docs/architect/briefs/2026-05-09_brief-annotateur-v2.md"
          - "docs/reports/2026-05-09_phase-annotateur-v2.md"
          - "docs/reports/2026-05-09_migration-annotateur-grille-v2.md"
      - id: REVIEW_PROD_ANNOTATE
        title: "Annoter les image_output produits par la pipeline (greffon prod)"
        phase: 4
        actors: ["admin_plateforme"]
        status: done
        description: "Greffon prod sur l'annotateur v2. Table polymorphe `annotation` (target_type/target_id, JSONB tags) accessible via 3 endpoints REST : GET /api/review/queue (image_output joints à image+job+annotation, filtres status/workflow_class), GET /api/review/file (sert le PNG, garde-fou path traversal), POST /api/annotation (upsert sur (target_type, target_id), whitelist target_type=image_output initialement, validation tags via vocabulaires partagés). UI : mode switch Benchmark/Production dans le header sticky, badge PROD orange non négociable, sous-titre image_id+job_id pour traçabilité. Aucun bouton apply/reject côté annotateur — la validation jobs reste dans jobs_editor.html. Vocabulaires IMAGE_TAGS_VOCAB (18) et PROMPT_TAGS_VOCAB (8) extraits dans src/api/annotation_vocab.py (single source of truth pour benchmark.py + review.py)."
        related_files:
          - "alembic/versions/0006_annotation_polymorphic.py"
          - "src/api/annotation_vocab.py"
          - "src/api/routes/review.py"
          - "src/api/models.py"
          - "src/api/main.py"
          - "data/benchmark-annotator.html"
          - "tests/test_review_routes.py"
          - "docs/architect/briefs/2026-05-09_brief-greffon-prod.md"
          - "docs/reports/2026-05-09_phase-greffon-prod.md"
          - "docs/workflow-pipeline.md"

  - id: agent
    label: "Agent de pilotage"
    use_cases:
      - id: AGENT_ORCHESTRATE_PIPELINE
        title: "Orchestrer le pipeline via un agent"
        phase: 6
        actors: ["agent_systeme"]
        status: planned
        description: "Un agent pilote les outils (taxonomie, LLM, génération, post-traitement, export) en respectant les garde-fous."
        related_files:
          - "architecture.md"
      - id: AGENT_SUGGEST_TOPICS_FROM_GAPS
        title: "Proposer des thèmes à partir des gaps de couverture"
        phase: 6
        actors: ["agent_systeme", "admin_plateforme"]
        status: planned
        description: "Analyser la couverture de la taxonomie et proposer de nouveaux thèmes à générer."
        related_files:
          - "architecture.md"
          - "docs/taxonomy_universal_v0.md"

  - id: sites
    label: "Portefeuille de sites"
    use_cases:
      - id: SITE_INIT_NEW_COLORING_SITE
        title: "Initialiser un nouveau site de coloriage"
        phase: 5
        actors: ["admin_plateforme"]
        status: planned
        description: "Créer la structure initiale d’un nouveau site (taxonomie simplifiée, premières collections exportées)."
        related_files:
          - "architecture.md"
      - id: SITE_SYNC_UPDATES
        title: "Synchroniser les mises à jour vers un site existant"
        phase: 5
        actors: ["admin_plateforme", "agent_systeme"]
        status: planned
        description: "Mettre à jour un site existant avec les nouvelles images/collections sans écraser le contenu local."
        related_files:
          - "architecture.md"

